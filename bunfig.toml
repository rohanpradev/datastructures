[test]
preload = ["./src/node-concepts/setup.ts"]
pathIgnorePatterns = ["practice/**"]
coverageReporter = ["text", "lcov"]
coverageDir = "coverage"
coverageSkipTestFiles = true
coverageThreshold = { lines = 0.60, functions = 0.60, statements = 0.60 }
coveragePathIgnorePatterns = [
	"practice/**",
	"src/ai/schema.ts",
	"src/node-concepts/setup.ts",
]

[install]
minimumReleaseAge = "1d"
minimumReleaseAgeExcludes = [
	"@biomejs/biome@2.6.2",
	"@types/bun@1.4.4",
	"typescript@7.0.2",
]

[fmt]
useTabs = true
printWidth = 80
endOfLine = "lf"
ignorePatterns = [".zed/**", "drizzle/**/snapshot.json"]
